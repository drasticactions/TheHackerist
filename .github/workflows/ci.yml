name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      AVALONIA_LICENSE_KEY: ${{ secrets.AVALONIA_LICENSE_KEY }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TheHackerist.slnx

      - name: Build
        run: dotnet build TheHackerist.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution TheHackerist.Tests.slnf -c Release --no-build
